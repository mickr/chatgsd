name: Release

# Every push to main that passes CI becomes a signed, notarized macOS release
# built on Mars, the self-hosted Mac that holds the runner. Versions live in
# tags, not commits: each release bumps the patch number of the latest tag,
# writes it into the build, and tags the exact commit it built. Run it by hand
# to release the current main as a new minor or major version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time, so two runs never pick the same version. Runs queue
# rather than replace each other: by default a newly queued run cancels the
# pending one, so an older or failed CI completion could push out the run for
# the newest main and then skip itself. Order doesn't matter, because only a
# run whose commit is still main's tip releases.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Choose the version
    # Only pushes to this repo's main; pull requests (including from forks
    # with a branch named main) never reach the signing job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Tags the commit here, while it's known to be main's tip. GitHub refuses
      # the job token any tag or release whose target commit has workflow files
      # that differ from main's, which a push landing mid-build would cause.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUMP: ${{ inputs.bump || 'patch' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          skip() { echo "$1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }

          main=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$main" = "$COMMIT" ] || skip "main has moved on to ${main:0:7}; that commit's run releases it."
          released=$(git tag --points-at "$COMMIT" --list 'v[0-9]*')
          [ "$MANUAL" = true ] || [ -z "$released" ] || skip "${COMMIT:0:7} is already released as $released."

          plan=$(scripts/next-version.sh "$BUMP")
          read -r previous version <<< "$plan"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$version" -f sha="$COMMIT" > /dev/null
          echo "Releasing ${COMMIT:0:7} as v$version (previous $previous)"

          delimiter="notes_$(openssl rand -hex 8)"
          {
            echo "release=true"
            echo "commit=$COMMIT"
            echo "version=$version"
            echo "notes<<$delimiter"
            git log --no-merges --format='- %s' "$previous..$COMMIT"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: Signed, notarized macOS release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: [self-hosted, macOS, ARM64, mars, apple-signing]
    # Reachable only from main; holds the signing and notarization secrets.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # Public in every signed build. The identity is set with the certificate
      # secret by scripts/configure-release-secrets.py, so a mismatch fails early.
      APPLE_SIGNING_IDENTITY: ${{ vars.SCRATCH_SIGN_IDENTITY }}
      APPLE_TEAM_ID: M9G92WURV3
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      # The fork's updater public key (~/.tauri/scratch-fork-updater.key.pub),
      # pinned here rather than read from tauri.conf.json so a merge from
      # upstream can't swap the key or the endpoint without failing a release.
      UPDATER_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDBCRUM5NURCNkYzODk4NTUKUldSVm1EaHYyNVhzQzJpNnNsRWlaUDladlAwN2ExcGg5L2g3UC9GQWRlT1FQa1lMd29ySmNzQ00K

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      # The release must attach to the tag the plan made on this commit. After
      # a withdrawal, re-running only this job would find no tag, and GitHub
      # would then tag main's current tip; a reused number could be another
      # commit's. Either way the binaries wouldn't match the tag, so stop.
      - name: Check the version is tagged on this commit
        run: |
          tagged=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)
          if [ "$tagged" != "$COMMIT" ]; then
            echo "::error::v$VERSION is on ${tagged:-no commit}, not $COMMIT. Use \"Re-run all jobs\" to plan a new version."
            exit 1
          fi

      - name: Set the version
        run: node scripts/set-version.mjs "$VERSION"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install signing identity
        env:
          SCRATCH_CERTIFICATE_BASE64: ${{ secrets.SCRATCH_CERTIFICATE_BASE64 }}
          SCRATCH_CERTIFICATE_PASSWORD: ${{ secrets.SCRATCH_CERTIFICATE_PASSWORD }}
        run: scripts/ci-signing.sh install

      # Builds, signs, notarizes and staples the app, signs the updater bundle,
      # and uploads everything to a draft release with latest.json for the tag
      # the plan created. The release stays on that tag's commit; naming main as
      # its commitish only keeps GitHub's workflow-file check passing.
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Notarization as the team's Apple ID with an app-specific password.
          APPLE_ID: ${{ vars.SCRATCH_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.SCRATCH_NOTARY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ChatGSD v__VERSION__"
          releaseCommitish: main
          releaseBody: |
            ${{ needs.plan.outputs.notes }}

            Download the DMG below. Installed copies update themselves.
          releaseDraft: true
          prerelease: false
          args: --bundles app,dmg

      - name: Verify the signed, notarized app
        run: |
          set -euo pipefail
          app=src-tauri/target/release/bundle/macos/ChatGSD.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$VERSION"
          # Installed copies must only ever update from this fork: the built app
          # has to carry exactly this repo's update feed and the fork's key.
          bin="$app/Contents/MacOS/ChatGSD"
          feeds=$(grep -aoE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/latest/download/latest\.json' "$bin" | sort -u)
          test "$feeds" = "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          grep -aqF "$UPDATER_PUBKEY" "$bin"
          # The MIT license must ship with every copy.
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          # Tauri signs externalBin executables with the release identity before
          # signing and notarizing the enclosing app. Don't ship upstream's signature.
          driver="$app/Contents/MacOS/cua-driver"
          test -x "$driver"
          test "$("$driver" --version)" = "cua-driver 0.38.0"
          requirement="anchor apple generic and certificate leaf = H\"$APPLE_SIGNING_IDENTITY\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --strict --verbose=2 --test-requirement "$requirement" "$driver"
          signature=$(codesign --display --verbose=4 "$driver" 2>&1)
          grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"

          # Automatic updates must carry the same executable, permissions and
          # license notices as a fresh install, not just the main app binary.
          updater_dir=$(mktemp -d "$RUNNER_TEMP/chatgsd-updater.XXXXXX")
          trap 'rm -rf "$updater_dir"' EXIT
          tar -xzf "$app.tar.gz" -C "$updater_dir" \
            ChatGSD.app/Contents/MacOS/cua-driver \
            ChatGSD.app/Contents/Resources/licenses/cua-driver/LICENSE \
            ChatGSD.app/Contents/Resources/licenses/cua-driver/THIRD_PARTY_NOTICES.md
          updated_app="$updater_dir/ChatGSD.app"
          test -x "$updated_app/Contents/MacOS/cua-driver"
          cmp "$driver" "$updated_app/Contents/MacOS/cua-driver"
          for license in LICENSE THIRD_PARTY_NOTICES.md; do
            cmp "src-tauri/resources/cua-driver/$license" "$app/Contents/Resources/licenses/cua-driver/$license"
            cmp "$app/Contents/Resources/licenses/cua-driver/$license" "$updated_app/Contents/Resources/licenses/cua-driver/$license"
          done

      # Only a verified build becomes the latest release the updater sees.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # A failed or cancelled run withdraws its version, so no tag points at a
      # build that never shipped and the next run reuses the number. A
      # published release is never touched. Retry with "Re-run all jobs", which
      # plans and tags again.
      - name: Withdraw the unpublished version
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/withdraw-release.sh "v$VERSION" "$COMMIT"

      - name: Remove signing identity
        if: always()
        run: scripts/ci-signing.sh remove

  # `npx chatgsd` installs the release with the same version. npm trusts this
  # workflow and environment to publish (trusted publishing, set in the
  # package's settings on npmjs.com), so no npm token is stored.
  npm:
    name: Publish the npm installer
    needs: [plan, macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The installer only accepts the DMG users download from the release,
      # identified by the checksum published with the package.
      - name: Pin the release's DMG
        working-directory: npm/chatgsd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="ChatGSD_${VERSION}_aarch64.dmg"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$dmg" --dir "$RUNNER_TEMP"
          sha256=$(sha256sum "$RUNNER_TEMP/$dmg" | cut -d ' ' -f 1)
          jq -n --arg version "$VERSION" --arg dmg "$dmg" --arg sha256 "$sha256" \
            '{version: $version, dmg: $dmg, sha256: $sha256}' > release.json
          npm pkg set version="$VERSION"
          cp ../../LICENSE .

      - name: Publish
        working-directory: npm/chatgsd
        run: npm publish --provenance --access public
