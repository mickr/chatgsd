name: Release

# Signed, notarized macOS builds on Mars, the self-hosted Mac that holds the
# runner. Only tags (and manual runs from a tag) can reach the release
# environment's secrets; outside pull requests need approval to run anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Signed, notarized macOS release
    runs-on: [self-hosted, macOS, ARM64, mars, apple-signing]
    environment: release
    timeout-minutes: 60
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # Public in every signed build; pinned so a wrong certificate fails early.
      APPLE_SIGNING_IDENTITY: A80792DBE5D34EC0F453FD5FE4E683603D02402C
      APPLE_TEAM_ID: M9G92WURV3

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Install signing identity
        env:
          SCRATCH_CERTIFICATE_BASE64: ${{ secrets.SCRATCH_CERTIFICATE_BASE64 }}
          SCRATCH_CERTIFICATE_PASSWORD: ${{ secrets.SCRATCH_CERTIFICATE_PASSWORD }}
        run: scripts/ci-signing.sh install

      # Builds, signs, notarizes and staples the app, signs the updater bundle,
      # and uploads everything to a draft release with latest.json.
      - name: Build and upload
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ vars.SCRATCH_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.SCRATCH_NOTARY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Scratch v__VERSION__"
          releaseBody: "Download the DMG below. Installed copies update themselves."
          releaseDraft: true
          prerelease: false
          args: --bundles app,dmg

      - name: Verify the signed, notarized app
        run: |
          app=src-tauri/target/release/bundle/macos/Scratch.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      # Only a verified build becomes the latest release the updater sees.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.appVersion }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Remove signing identity
        if: always()
        run: scripts/ci-signing.sh remove
